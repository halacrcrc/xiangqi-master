[package]
name = "xiangqi-master"
version = "1.0.0"
description = "象棋大师 - 现代化中国象棋对弈与训练应用"
authors = ["you"]
edition = "2021"

[lib]
name = "xiangqi_master_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
